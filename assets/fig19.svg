<text x="40" y="48" font-family="Arial" font-size="24" font-weight="800" fill="#183247">Experimento de Jenner: exposición y protección</text><g transform="translate(50,130)"><circle cx="55" cy="45" r="42" fill="#dff6f3"/><circle cx="55" cy="31" r="12" fill="#183247" opacity=".85"/><path d="M35 79 Q55 58 75 79" fill="none" stroke="#183247" stroke-width="7" stroke-linecap="round"/><text x="55" y="120" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#183247">Viruela bovina</text><text x="55" y="140" text-anchor="middle" font-family="Arial" font-size="11" fill="#62788a">Exposición</text></g><path d="M150 175 H195" stroke="#0ea5b7" stroke-width="5" stroke-linecap="round"/><path d="M195 175 l-12 -8 v16 z" fill="#0ea5b7"/><g transform="translate(215,130)"><circle cx="55" cy="45" r="42" fill="#ece8ff"/><circle cx="55" cy="31" r="12" fill="#183247" opacity=".85"/><path d="M35 79 Q55 58 75 79" fill="none" stroke="#183247" stroke-width="7" stroke-linecap="round"/><text x="55" y="120" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#183247">Inoculación</text><text x="55" y="140" text-anchor="middle" font-family="Arial" font-size="11" fill="#62788a">Material de pústula</text></g><path d="M315 175 H360" stroke="#0ea5b7" stroke-width="5" stroke-linecap="round"/><path d="M360 175 l-12 -8 v16 z" fill="#0ea5b7"/><g transform="translate(380,130)"><circle cx="55" cy="45" r="42" fill="#fff2d9"/><circle cx="55" cy="31" r="12" fill="#183247" opacity=".85"/><path d="M35 79 Q55 58 75 79" fill="none" stroke="#183247" stroke-width="7" stroke-linecap="round"/><text x="55" y="120" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#183247">Enfermedad leve</text><text x="55" y="140" text-anchor="middle" font-family="Arial" font-size="11" fill="#62788a">Respuesta inmune</text></g><path d="M480 175 H525" stroke="#0ea5b7" stroke-width="5" stroke-linecap="round"/><path d="M525 175 l-12 -8 v16 z" fill="#0ea5b